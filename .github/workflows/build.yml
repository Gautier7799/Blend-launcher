name: Build Blend Launcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Gradle Environment
      run: |
        # التأكد من وجود ملف gradlew وصلاحياته
        if [ ! -f "gradlew" ]; then
          wget -q https://raw.githubusercontent.com/cortinico/kotlin-android-template/main/gradlew
          chmod +x gradlew
          mkdir -p gradle/wrapper
          wget -q https://raw.githubusercontent.com/cortinico/kotlin-android-template/main/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          wget -q https://raw.githubusercontent.com/cortinico/kotlin-android-template/main/gradle/wrapper/gradle-wrapper.properties -O gradle/wrapper/gradle-wrapper.properties
        else
          chmod +x gradlew
        fi

        # تفعيل AndroidX بشكل إجباري في الجذر وداخل مجلد التطبيق
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
        mkdir -p app
        cp gradle.properties app/gradle.properties

    - name: Build Debug APK
      run: |
        # كتابة الخيار مباشرة قبل تشغيل البناء لضمان قراءته 100%
        echo "android.useAndroidX=true" > gradle.properties
        ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BlendLauncher-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
